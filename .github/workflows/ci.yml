name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out server repository
        uses: actions/checkout@v4
        with:
          path: deki-smpc-server

      - name: Check out client repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deki-smpc
          path: deki-smpc
          token: ${{ secrets.DEKI_SMPC_READ_TOKEN || github.token }}

      - name: Match the client branch when available
        working-directory: deki-smpc
        env:
          CLIENT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads origin "$CLIENT_REF" >/dev/null; then
            git fetch --depth=1 origin "$CLIENT_REF"
            git checkout --detach FETCH_HEAD
          fi

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: deki-smpc-server
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deki-smpc-server/pyproject.toml

      - name: Install client, server, and test dependencies
        working-directory: deki-smpc-server
        run: |
          python -m pip install -e ../deki-smpc
          python -m pip install -e '.[test]'

      - name: Run pre-commit hooks
        working-directory: deki-smpc-server
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Lint
        working-directory: deki-smpc-server
        run: ruff check key-aggregation-server

      - name: Type check
        working-directory: deki-smpc-server
        run: mypy

      - name: Test
        working-directory: deki-smpc-server
        run: python -m pytest -q

      - name: Build container image
        run: >-
          docker build --pull
          --tag deki-smpc-server:${{ github.sha }}
          deki-smpc-server/key-aggregation-server

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: deki-smpc-server:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0
          skip-setup-trivy: true
