[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deki-smpc-server"
version = "1.0.1"
description = "deki-smpc v1 secure aggregation coordinator and worker"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Benjamin Hamm", email = "benjamin.hamm@dkfz-heidelberg.de"}]
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "safetensors>=0.4,<1",
  "torch>=2.13,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "dynamic-network-architectures>=0.4.4,<0.5",
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["key-aggregation-server"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["key-aggregation-server/tests"]
pythonpath = ["key-aggregation-server", "../deki-smpc"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["key-aggregation-server"]

[tool.isort]
profile = "black"
line_length = 120
py_version = 312
known_first_party = ["app"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["key-aggregation-server/app"]
mypy_path = "key-aggregation-server"
